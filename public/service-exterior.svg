<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- House outline -->
  <path d="M100 160 L200 80 L300 160" stroke="#2196F3" stroke-width="3" fill="none" stroke-opacity="0.6"/>
  <rect x="110" y="160" width="180" height="120" rx="4" fill="#1E3A5F" fill-opacity="0.3" stroke="#2196F3" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Windows -->
  <rect x="135" y="180" width="50" height="40" rx="3" fill="#E3F2FD" fill-opacity="0.3" stroke="#64B5F6" stroke-width="1.5"/>
  <line x1="160" y1="180" x2="160" y2="220" stroke="#64B5F6" stroke-width="1"/>
  <line x1="135" y1="200" x2="185" y2="200" stroke="#64B5F6" stroke-width="1"/>

  <rect x="215" y="180" width="50" height="40" rx="3" fill="#E3F2FD" fill-opacity="0.15" stroke="#64B5F6" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="240" y1="180" x2="240" y2="220" stroke="#64B5F6" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="215" y1="200" x2="265" y2="200" stroke="#64B5F6" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Water-fed pole -->
  <line x1="80" y1="280" x2="150" y2="170" stroke="#42A5F5" stroke-width="4" stroke-linecap="round"/>
  <rect x="140" y="165" width="24" height="10" rx="3" fill="#42A5F5"/>

  <!-- Water spray -->
  <circle cx="148" cy="185" r="2" fill="#64B5F6" fill-opacity="0.5"/>
  <circle cx="155" cy="190" r="1.5" fill="#64B5F6" fill-opacity="0.4"/>
  <circle cx="142" cy="192" r="2.5" fill="#64B5F6" fill-opacity="0.3"/>

  <!-- Sparkles on clean window -->
  <g fill="#FFD54F">
    <path d="M150 190l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity="0.8"/>
    <path d="M170 185l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity="0.6"/>
  </g>

  <!-- Ground line -->
  <line x1="60" y1="280" x2="340" y2="280" stroke="#64B5F6" stroke-opacity="0.2" stroke-width="1"/>
</svg>
