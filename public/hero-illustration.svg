<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- Window frame -->
  <rect x="180" y="60" width="240" height="320" rx="8" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="300" y1="60" x2="300" y2="380" stroke="white" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="180" y1="220" x2="420" y2="220" stroke="white" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Clean sparkle effect on top-left pane -->
  <rect x="186" y="66" width="108" height="148" rx="4" fill="url(#cleanGrad)"/>
  <!-- Dirty effect on other panes -->
  <rect x="306" y="66" width="108" height="148" rx="4" fill="white" fill-opacity="0.03"/>
  <rect x="186" y="226" width="108" height="148" rx="4" fill="white" fill-opacity="0.03"/>
  <rect x="306" y="226" width="108" height="148" rx="4" fill="white" fill-opacity="0.03"/>

  <!-- Squeegee tool -->
  <rect x="130" y="100" width="8" height="200" rx="4" fill="#64B5F6" fill-opacity="0.8"/>
  <rect x="110" y="90" width="48" height="16" rx="4" fill="#42A5F5"/>
  <rect x="114" y="106" width="40" height="4" rx="2" fill="#90CAF9"/>

  <!-- Water drops -->
  <circle cx="140" cy="320" r="4" fill="#64B5F6" fill-opacity="0.6"/>
  <circle cx="155" cy="340" r="3" fill="#64B5F6" fill-opacity="0.4"/>
  <circle cx="128" cy="350" r="5" fill="#64B5F6" fill-opacity="0.5"/>
  <circle cx="160" cy="360" r="3" fill="#64B5F6" fill-opacity="0.3"/>

  <!-- Sparkles on clean pane -->
  <g fill="#FFD54F">
    <path d="M220 110l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity="0.9"/>
    <path d="M250 150l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity="0.7"/>
    <path d="M200 170l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity="0.5"/>
  </g>

  <!-- Spray bottle -->
  <rect x="440" y="180" width="24" height="60" rx="6" fill="#42A5F5" fill-opacity="0.7"/>
  <rect x="446" y="160" width="12" height="24" rx="2" fill="#64B5F6" fill-opacity="0.6"/>
  <rect x="435" y="156" width="18" height="8" rx="2" fill="#90CAF9" fill-opacity="0.5"/>

  <!-- Spray mist -->
  <circle cx="430" cy="165" r="2" fill="#E3F2FD" fill-opacity="0.4"/>
  <circle cx="420" cy="158" r="2" fill="#E3F2FD" fill-opacity="0.3"/>
  <circle cx="425" cy="172" r="1.5" fill="#E3F2FD" fill-opacity="0.3"/>

  <!-- Cloud reflections -->
  <ellipse cx="230" cy="120" rx="20" ry="8" fill="white" fill-opacity="0.15"/>
  <ellipse cx="260" cy="130" rx="15" ry="6" fill="white" fill-opacity="0.1"/>

  <!-- Bucket -->
  <path d="M460 380 L440 420 L500 420 L480 380 Z" fill="#42A5F5" fill-opacity="0.5"/>
  <ellipse cx="470" cy="380" rx="20" ry="6" fill="#64B5F6" fill-opacity="0.5"/>
  <path d="M450 370 Q470 350 490 370" stroke="#90CAF9" stroke-width="3" fill="none" stroke-opacity="0.5"/>

  <!-- Bubbles -->
  <circle cx="465" cy="395" r="4" fill="white" fill-opacity="0.2" stroke="white" stroke-opacity="0.3"/>
  <circle cx="478" cy="400" r="3" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.25"/>
  <circle cx="458" cy="405" r="5" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>

  <defs>
    <linearGradient id="cleanGrad" x1="186" y1="66" x2="294" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E3F2FD" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#BBDEFB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#90CAF9" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
