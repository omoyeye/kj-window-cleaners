<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Window frame from inside -->
  <rect x="80" y="40" width="240" height="200" rx="6" fill="#E3F2FD" fill-opacity="0.1" stroke="#64B5F6" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="200" y1="40" x2="200" y2="240" stroke="#64B5F6" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="80" y1="140" x2="320" y2="140" stroke="#64B5F6" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Curtains -->
  <path d="M75 35 Q90 80 80 140 Q75 160 78 180 L70 180 Q65 140 70 100 Q75 60 70 35Z" fill="#42A5F5" fill-opacity="0.15"/>
  <path d="M325 35 Q310 80 320 140 Q325 160 322 180 L330 180 Q335 140 330 100 Q325 60 330 35Z" fill="#42A5F5" fill-opacity="0.15"/>

  <!-- Hand with cloth -->
  <ellipse cx="250" cy="120" rx="30" ry="20" fill="#FFB74D" fill-opacity="0.5"/>
  <rect x="230" y="110" width="40" height="20" rx="8" fill="#FFF9C4" fill-opacity="0.4"/>

  <!-- Clean streaks -->
  <path d="M160 70 Q180 80 170 100" stroke="white" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
  <path d="M130 90 Q150 100 140 120" stroke="white" stroke-opacity="0.2" stroke-width="1.5" fill="none"/>

  <!-- Sky through window -->
  <circle cx="140" cy="80" r="15" fill="#FFF9C4" fill-opacity="0.15"/>
  <ellipse cx="260" cy="70" rx="25" ry="10" fill="white" fill-opacity="0.1"/>

  <!-- Sparkles -->
  <g fill="#FFD54F">
    <path d="M120 100l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity="0.7"/>
    <path d="M170 160l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity="0.5"/>
    <path d="M280 90l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity="0.6"/>
  </g>

  <!-- Window sill -->
  <rect x="70" y="240" width="260" height="12" rx="3" fill="#1E3A5F" fill-opacity="0.3"/>

  <!-- Plant on sill -->
  <rect x="290" y="228" width="16" height="14" rx="2" fill="#A5D6A7" fill-opacity="0.3"/>
  <circle cx="298" cy="220" r="10" fill="#66BB6A" fill-opacity="0.3"/>
  <circle cx="290" cy="218" r="7" fill="#81C784" fill-opacity="0.3"/>
</svg>
